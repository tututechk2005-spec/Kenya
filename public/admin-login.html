<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login | AI Trader</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="glass auth-card animate-in">
      <h2>Admin Login</h2>
      <div class="sub">Restricted access - platform administrators only</div>
      <div id="alert-box"></div>
      <form id="admin-login-form">
        <div class="field"><label>Username</label><input type="text" name="username" required /></div>
        <div class="field"><label>Password</label><input type="password" name="password" required /></div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Log In</button>
      </form>
      <div class="auth-footer"><a href="/login.html" style="color:var(--text-1);">&larr; Back to user login</a></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const alertBox = document.getElementById('alert-box');
      alertBox.innerHTML = '';
      btn.disabled = true; btn.textContent = 'Logging in...';
      const form = new FormData(e.target);
      try {
        const data = await Api.post('/api/auth/admin/login', { username: form.get('username'), password: form.get('password') });
        localStorage.setItem('admin_token', data.token);
        window.location.href = '/admin-dashboard.html';
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        btn.disabled = false; btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
