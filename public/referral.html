<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Referral | AI Trader</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div id="page-content">
      <div class="animate-in" style="margin-bottom:24px;">
        <h1 style="margin:0 0 4px;">Referral Program</h1>
        <p style="color:var(--text-1);margin:0;">Share your link and earn.</p>
      </div>

      <div class="glass card animate-in" style="margin-bottom:20px;">
        <div class="stat-label">Your Referral Link</div>
        <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;">
          <input id="ref-link" readonly style="flex:1;min-width:220px;padding:12px 16px;border-radius:12px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.03);color:var(--text-0);" />
          <button class="btn btn-primary btn-sm" onclick="copyLink()">Copy Link</button>
        </div>
      </div>

      <div class="stat-grid animate-in" style="margin-bottom:20px;">
        <div class="glass stat-card"><div class="stat-label">Total Referrals</div><div class="stat-value" id="total-referrals">0</div></div>
        <div class="glass stat-card"><div class="stat-label">Active Referrals</div><div class="stat-value" id="active-referrals">0</div></div>
        <div class="glass stat-card"><div class="stat-label">Total Earnings</div><div class="stat-value" id="total-earnings">$0.00</div></div>
        <div class="glass stat-card"><div class="stat-label">Balance</div><div class="stat-value" id="balance">$0.00</div></div>
      </div>

      <div class="grid-2 animate-in">
        <div class="glass card">
          <h3 style="margin-top:0;">Referral History</h3>
          <div id="history-list"><div class="empty-state">No referrals yet.</div></div>
        </div>
        <div class="glass card">
          <h3 style="margin-top:0;">Leaderboard</h3>
          <div id="leaderboard-list"><div class="empty-state">No data yet.</div></div>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    function copyLink() {
      const input = document.getElementById('ref-link');
      input.select(); document.execCommand('copy');
    }

    async function load() {
      const d = await Api.get('/api/referral');
      document.getElementById('ref-link').value = d.referralLink;
      document.getElementById('total-referrals').textContent = d.totalReferrals;
      document.getElementById('active-referrals').textContent = d.activeReferrals;
      document.getElementById('total-earnings').textContent = `$${d.totalEarnings.toFixed(2)}`;
      document.getElementById('balance').textContent = `$${d.balance.toFixed(2)}`;

      const historyList = document.getElementById('history-list');
      historyList.innerHTML = d.history.length
        ? d.history.map(h => `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--glass-border);"><span>${h.name}</span><span class="badge badge-green">${h.status}</span></div>`).join('')
        : '<div class="empty-state">No referrals yet.</div>';

      const lb = await Api.get('/api/referral/leaderboard');
      const lbList = document.getElementById('leaderboard-list');
      lbList.innerHTML = lb.leaderboard.length
        ? lb.leaderboard.map((r, i) => `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--glass-border);"><span>#${i+1} ${r.name}</span><span>${r.referral_count} referrals</span></div>`).join('')
        : '<div class="empty-state">No data yet.</div>';
    }
    load();
  </script>
</body>
</html>
