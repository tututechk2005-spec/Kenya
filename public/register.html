<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account | AI Trader</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="glass auth-card animate-in">
      <h2>Create your account</h2>
      <div class="sub">Start with Testnet, upgrade to live trading anytime</div>
      <div id="alert-box"></div>
      <form id="register-form">
        <div class="field">
          <label>Full Name</label>
          <input type="text" name="name" required placeholder="Jane Trader" />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" required minlength="8" placeholder="At least 8 characters" />
        </div>
        <div class="field">
          <label>Referral Code (optional)</label>
          <input type="text" name="referralCode" id="referral-input" placeholder="e.g. JANE1A2B3C" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Create Account</button>
      </form>
      <div class="auth-footer">Already have an account? <a href="/login.html" style="color:var(--accent);">Log in</a></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref');
    if (ref) document.getElementById('referral-input').value = ref;

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const alertBox = document.getElementById('alert-box');
      alertBox.innerHTML = '';
      btn.disabled = true; btn.textContent = 'Creating account...';
      const form = new FormData(e.target);
      try {
        const data = await Api.post('/api/auth/register', {
          name: form.get('name'), email: form.get('email'), password: form.get('password'),
          referralCode: form.get('referralCode') || undefined,
        });
        localStorage.setItem('token', data.token);
        window.location.href = '/dashboard.html';
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
