<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password | AI Trader</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="glass auth-card animate-in">
      <h2>Set a new password</h2>
      <div class="sub">Choose a strong new password for your account</div>
      <div id="alert-box"></div>
      <form id="reset-form">
        <div class="field">
          <label>New Password</label>
          <input type="password" name="password" required minlength="8" placeholder="At least 8 characters" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Update Password</button>
      </form>
      <div class="auth-footer"><a href="/login.html" style="color:var(--accent);">Back to log in</a></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const alertBox = document.getElementById('alert-box');
      alertBox.innerHTML = '';
      if (!token) {
        alertBox.innerHTML = '<div class="alert alert-error">Missing or invalid reset link.</div>';
        return;
      }
      btn.disabled = true; btn.textContent = 'Updating...';
      const form = new FormData(e.target);
      try {
        await Api.post('/api/auth/reset-password', { token, password: form.get('password') });
        alertBox.innerHTML = '<div class="alert alert-success">Password updated. Redirecting to log in...</div>';
        setTimeout(() => window.location.href = '/login.html', 1500);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        btn.disabled = false; btn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
