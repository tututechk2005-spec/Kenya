<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password | AI Trader</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="glass auth-card animate-in">
      <h2>Reset your password</h2>
      <div class="sub">Enter your account email and we'll send a reset link</div>
      <div id="alert-box"></div>
      <form id="forgot-form">
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" required placeholder="you@example.com" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Send Reset Link</button>
      </form>
      <div class="auth-footer"><a href="/login.html" style="color:var(--accent);">Back to log in</a></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const alertBox = document.getElementById('alert-box');
      alertBox.innerHTML = '';
      btn.disabled = true; btn.textContent = 'Sending...';
      const form = new FormData(e.target);
      try {
        const data = await Api.post('/api/auth/forgot-password', { email: form.get('email') });
        let html = `<div class="alert alert-success">${data.message}</div>`;
        if (data.devResetLink) {
          html += `<div class="alert alert-info">Dev mode (no SMTP configured) - reset link: <a href="${data.devResetLink}" style="color:#93c5fd;">${data.devResetLink}</a></div>`;
        }
        alertBox.innerHTML = html;
        btn.textContent = 'Link Sent';
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        btn.disabled = false; btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
