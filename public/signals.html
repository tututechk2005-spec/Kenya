<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signals | AI Trader</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div id="page-content">
      <div class="animate-in" style="margin-bottom:24px;">
        <h1 style="margin:0 0 4px;">AI Signals</h1>
        <p style="color:var(--text-1);margin:0;">Every signal the engine has generated, with its full confidence breakdown.</p>
      </div>
      <div class="glass card animate-in">
        <div id="signals-table"><div class="empty-state">No signals yet.</div></div>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    async function load() {
      const { signals } = await Api.get('/api/signals');
      const table = document.getElementById('signals-table');
      if (!signals.length) { table.innerHTML = '<div class="empty-state">No signals yet.</div>'; return; }
      table.innerHTML = `<table><thead><tr><th>Time</th><th>Symbol</th><th>Direction</th><th>Confidence</th><th>Trend</th><th>Volume</th><th>Momentum</th><th>R:R</th><th>Status</th></tr></thead><tbody>
        ${signals.map(s => `<tr>
          <td>${new Date(s.created_at*1000).toLocaleString()}</td>
          <td>${s.symbol}</td>
          <td>${s.direction === 'long' ? '<span class="badge badge-green">LONG</span>' : '<span class="badge badge-red">SHORT</span>'}</td>
          <td>${s.confidence}%</td>
          <td>${s.trend_confirmed ? '✅' : '—'}</td>
          <td>${s.volume_confirmed ? '✅' : '—'}</td>
          <td>${s.momentum_confirmed ? '✅' : '—'}</td>
          <td>1:${(s.risk_reward||0).toFixed(2)}</td>
          <td><span class="badge badge-blue">${s.status}</span></td>
        </tr>`).join('')}
      </tbody></table>`;
    }
    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
